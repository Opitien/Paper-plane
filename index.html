<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Paper Plane</title>
    <meta name="description" content="Fold, throw, ride the wind. A browser flight game about keeping a paper plane in the air for as long as you can." />
    <meta name="theme-color" content="#5aa7e6" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paper Plane" />

    <!-- Social cards. %SITE_URL% is filled at build time from SITE_URL, Vercel's URL, or the live site (see vite.config.ts). -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:site_name" content="Paper Plane" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Paper Plane" />
    <meta property="og:description" content="Fold, throw, ride the wind. A browser flight game about keeping a paper plane in the air for as long as you can." />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paper Plane" />
    <meta name="twitter:description" content="Fold, throw, ride the wind. A browser flight game about keeping a paper plane in the air for as long as you can." />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
